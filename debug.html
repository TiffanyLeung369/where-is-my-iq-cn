<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Debug Vue Events</title>
  <script src="./js/lib/vue.global.prod.js"></script>
</head>
<body>
  <div id="app">
    <h1>Vue Event Test</h1>
    <button @click="testClick">Test Button</button>
    <p>Clicked: {{ clicked }}</p>
  </div>

  <script>
    const { createApp, ref } = Vue;

    const app = createApp({
      setup() {
        const clicked = ref(0);

        const testClick = () => {
          clicked.value++;
          console.log('Button clicked!', clicked.value);
        };

        return { clicked, testClick };
      }
    });

    app.mount('#app');
    console.log('Vue app mounted');
  </script>
</body>
</html>
