<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>岛屿预览</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Microsoft YaHei', sans-serif; background: #333; padding: 10px; }
    h1 { text-align: center; color: #fff; margin-bottom: 10px; font-size: 18px; }
    .legend {
      display: flex; justify-content: center; gap: 16px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #ccc; }
    .legend-dot {
      width: 18px; height: 18px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; font-weight: 700; color: #fff;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .card { position: relative; }
    .card-title {
      text-align: center; font-size: 11px; font-weight: 700;
      color: #fff; padding: 2px 0;
    }
    .card-wrap { position: relative; }
    .card-wrap img { width: 100%; display: block; }
    .card-wrap img.mirrored { transform: scaleX(-1); }
    .nodes-layer { position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
    /* 基础节点 */
    .node {
      position: absolute;
      width: 8.53%; aspect-ratio: 1;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 6;
    }
    .node-lbl { font-size: 8px; font-weight: 700; line-height: 1; }
    .node-stars { display: flex; gap: 0; line-height: 1; margin-top: 1px; }
    .star { font-size: 6px; color: rgba(0,0,0,0.3); }
    .star.on { color: #FFD700; text-shadow: 0 0 2px rgba(0,0,0,0.6); }
    /* 满星 金色 */
    .n-perfect {
      background: linear-gradient(135deg, #FFD54F, #FF8F00);
      border: 1.5px solid #fff;
      box-shadow: 0 1px 6px rgba(255,143,0,0.5);
    }
    .n-perfect .node-lbl { color: #fff; font-weight: 800; }
    /* 已过（非满星）白色 */
    .n-passed {
      background: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 1px 4px rgba(0,0,0,0.15);
    }
    .n-passed .node-lbl { color: #666; }
    /* 当前关 蓝色脉冲 */
    .n-current {
      background: linear-gradient(135deg, #42A5F5, #1565C0);
      border: 1.5px solid #fff;
      box-shadow: 0 1px 8px rgba(21,101,192,0.6);
      animation: ring-pulse 1.6s ease-out infinite;
    }
    .n-current .node-lbl { color: #fff; font-weight: 800; }
    @keyframes ring-pulse {
      0%, 100% { box-shadow: 0 1px 8px rgba(21,101,192,0.6); }
      50% { box-shadow: 0 1px 14px rgba(21,101,192,0.9), 0 0 0 4px rgba(66,165,245,0.3); }
    }
    /* 未解锁 蓝色虚线 */
    .n-locked {
      background: rgba(0,0,0,0.15);
      border: 1.5px dashed #78C5E3;
    }
    .n-locked .node-lck { width: 10px; height: 10px; opacity: 0.55; }
    /* 教程 */
    .n-tutorial {
      background: linear-gradient(135deg, #66BB6A, #2E7D32);
      border: 1.5px solid #fff;
      box-shadow: 0 1px 4px rgba(46,125,50,0.4);
    }
    .n-tutorial .node-lbl { color: #fff; }
    /* 路径点 */
    .trail {
      position: absolute; width: 3px; height: 3px; border-radius: 50%;
      background: rgba(255,255,255,0.4); transform: translate(-50%, -50%);
    }
  </style>
</head>
<body>
  <h1>🏕️ 24 座岛屿 · 关卡分布预览</h1>
  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:linear-gradient(135deg,#FFD54F,#FF8F00);border:1.5px solid #fff">★</div>
      <span>满星</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:rgba(255,255,255,0.85);border:1px solid rgba(0,0,0,0.12);color:#666">✓</div>
      <span>已过</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:linear-gradient(135deg,#42A5F5,#1565C0);border:1.5px solid #fff">!</div>
      <span>当前</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:rgba(0,0,0,0.15);border:1.5px dashed #78C5E3;color:rgba(0,0,0,0.25)">🔒</div>
      <span>未解锁</span>
    </div>
  </div>
  <div class="grid" id="grid"></div>
  <script>
    const LOCK_IMG = 'assets/images/lock.png';
    const P = {
      1: [
        {x:21,y:87},{x:36,y:84},{x:50,y:81},{x:64,y:78},{x:76,y:73},
        {x:88,y:66},{x:90,y:56},{x:81,y:48},{x:67,y:47},{x:52,y:49},
        {x:35,y:50},{x:20,y:49},{x:9,y:41},{x:8,y:31},{x:16,y:22},
        {x:29,y:16},{x:44,y:13},{x:59,y:11},{x:75,y:11},{x:88,y:15},
      ],
      2: [
        {x:27,y:86},{x:18,y:76},{x:13,y:64},{x:16,y:52},{x:27,y:44},
        {x:43,y:42},{x:54,y:50},{x:57,y:60},{x:66,y:69},{x:82,y:70},
        {x:89,y:61},{x:90,y:49},{x:89,y:38},{x:84,y:27},{x:75,y:19},
        {x:61,y:13},{x:46,y:12},{x:30,y:16},{x:20,y:24},{x:10,y:36},
      ],
      3: [
        {x:50,y:92},{x:35,y:88},{x:20,y:82},{x:12,y:72},{x:10,y:60},
        {x:8,y:46},{x:12,y:32},{x:24,y:22},{x:40,y:14},{x:58,y:14},
        {x:72,y:18},{x:82,y:28},{x:86,y:40},{x:82,y:54},{x:74,y:64},
        {x:62,y:70},{x:48,y:68},{x:34,y:62},{x:28,y:50},{x:32,y:38},
      ],
    };
    const g = document.getElementById('grid');

    function getStatus(n) {
      if (n < 8) return 'perfect';
      if (n < 11) return 'passed';
      if (n === 11) return 'current';
      return 'locked';
    }
    function getStars(st) {
      if (st === 'perfect') return 3;
      if (st === 'passed') return [1,2,2][Math.floor(Math.random()*3)];
      return 0;
    }

    for (let idx = 1; idx <= 24; idx++) {
      const s = (idx-1)*20+1, e = s+19;
      const pk = ((idx-1)%3)+1, path = P[pk];
      const cp = (idx-1)%24, bi = (cp%12)+1, mir = cp>=12;
      let nh = '';
      if (idx===1) nh += `<div class="node n-tutorial" style="left:10%;top:92%"><span class="node-lbl">0</span></div>`;
      for (let n=0;n<20;n++) {
        const lv=s+n, nx=mir?(100-path[n].x):path[n].x, ny=path[n].y;
        const st = getStatus(n), stars = getStars(st);
        if (n<19) {
          const nx2=mir?(100-path[n+1].x):path[n+1].x, ny2=path[n+1].y;
          for (let t=1;t<=2;t++) {
            nh += `<div class="trail" style="left:${nx+(nx2-nx)*t/3}%;top:${ny+(ny2-ny)*t/3}%"></div>`;
          }
        }
        let inner = '';
        if (st === 'locked') {
          inner = `<img class="node-lck" src="${LOCK_IMG}" style="object-fit:contain" />`;
        } else {
          let sh = '';
          if (stars > 0) {
            sh = `<div class="node-stars">`;
            for (let i=0;i<3;i++) sh += `<span class="star ${i<stars?'on':''}">★</span>`;
            sh += `</div>`;
          }
          inner = `<span class="node-lbl">${lv}</span>${sh}`;
        }
        nh += `<div class="node n-${st}" style="left:${nx}%;top:${ny}%">${inner}</div>`;
      }
      g.innerHTML += `<div class="card">
        <div class="card-title">第${idx}岛 (${s}-${e}关)</div>
        <div class="card-wrap">
          <img src="assets/images/island_${bi}.png" class="${mir?'mirrored':''}" />
          <div class="nodes-layer">${nh}</div>
        </div>
      </div>`;
    }
  </script>
</body>
</html>
