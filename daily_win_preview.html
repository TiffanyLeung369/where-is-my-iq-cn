<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日挑战通关预览 (Daily Challenge Win Preview)</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #FFB75E, #ED8F03);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        /* 沉浸式每日挑战特效页面 */
        .daily-result-page {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            color: #fff;
        }

        /* 1 & 2行：偏左的返回首页与贝壳数量 */
        .daily-top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px;
            margin-top: 40px; /* 模拟状态栏 */
            z-index: 20;
        }

        .daily-r1-home {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 16px;
            font-weight: 600;
            background: rgba(0,0,0,0.15);
            padding: 8px 14px;
            border-radius: 20px;
            backdrop-filter: blur(4px);
            cursor: pointer;
        }

        .daily-r2-shell {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 12px 4px 6px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        /* 3行：标题 */
        .daily-r3-title {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            text-shadow: 0 4px 12px rgba(235, 100, 0, 0.6);
            margin-top: 20px;
            letter-spacing: 2px;
            z-index: 20;
        }

        /* 4行：正中央的庆祝动画 */
        .daily-r4-anim {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .celebrate-img-large {
            width: 140px;
            height: 140px;
            animation: celebrate-dance-large 1.2s ease-in-out infinite;
            z-index: 20;
        }

        @keyframes celebrate-dance-large {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            15% { transform: translateY(-15px) rotate(-8deg) scale(1.1); }
            30% { transform: translateY(0) rotate(8deg) scale(1); }
            45% { transform: translateY(-10px) rotate(-5deg) scale(1.08); }
            60% { transform: translateY(0) rotate(5deg) scale(1); }
            75% { transform: translateY(-5px) rotate(-3deg) scale(1.05); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }

        /* 5行 & 6行：金币与贝壳并发奖励 */
        .daily-r56-rewards {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
            z-index: 20;
        }

        .reward-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #fff;
            padding: 10px 24px;
            border-radius: 30px;
            box-shadow: 0 8px 24px rgba(210, 100, 0, 0.3);
        }

        .reward-box img {
            width: 28px;
            height: 28px;
        }

        .reward-box text {
            font-size: 24px;
            font-weight: 900;
        }
        .txt-yellow { color: #F5A623; }
        .txt-blue { color: #4A90E2; }

        /* 8行：双倍按钮 */
        .daily-r8-btn {
            display: flex;
            justify-content: center;
            margin-bottom: 60px;
            z-index: 20;
            padding: 0 20px;
        }

        .btn-ad-boost-xl {
            width: 100%;
            max-width: 340px;
            height: 60px;
            background: linear-gradient(135deg, #4A90E2, #9E58FF);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 6px 20px rgba(74, 144, 226, 0.4);
            border: none;
            color: #fff;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
        }

        /* 坠落的彩纸 */
        .confetti-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            opacity: 0;
            animation: confetti-fall 2.5s linear infinite;
        }

        @keyframes confetti-fall {
            0% { transform: translateY(-40px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(80vh) rotate(1080deg); opacity: 0; }
        }

        /* 涌泉喷射式底部礼炮 (根据最新要求实装) */
        .cannon-container {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 15;
        }

        .cannon-particle {
            position: absolute;
            bottom: -10px;
            border-radius: 2px;
            opacity: 0;
            width: 6px;
            height: 6px;
            animation-fill-mode: forwards;
        }

        @keyframes shoot-left {
            0% { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 1; }
            60% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot)); opacity: 0; }
        }
        @keyframes shoot-right {
            0% { transform: translate(0, 0) scale(0.3) rotate(0deg); opacity: 1; }
            60% { opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1) rotate(var(--rot)); opacity: 0; }
        }

    </style>
</head>
<body>

<div class="daily-result-page">
    
    <!-- 顶部状态栏与贝壳 -->
    <div class="daily-top-row">
        <div class="daily-r1-home">
            <span style="font-size: 14px; margin-right: 2px;">◀</span> 返回首页
        </div>
        <div class="daily-r2-shell">
            <svg style="width:20px;height:20px;margin-right:6px" viewBox="0 0 24 24" fill="#FFC107"><path d="M12 2L4 10a11 11 0 0 0 16 0L12 2z"/></svg>
            <span>4/20</span>
        </div>
    </div>

    <!-- 标题 -->
    <div class="daily-r3-title">
        今日挑战成功
    </div>

    <!-- 动画与特效区 -->
    <div class="daily-r4-anim">
        <!-- 随机的小螃蟹/表情跳舞 -->
        <img class="celebrate-img-large" src="./images/crab_walk_1.png" alt="Dance" onerror='this.src="data:image/svg+xml;utf8,<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 100 100\"><text y=\"50\" font-size=\"40\">🦀</text></svg>"'>
        
        <!-- 下落的满屏彩纸 -->
        <div class="confetti-container" id="confetti-box"></div>
        
        <!-- 左下方与右下方的冲刺礼花 (规范最新版) -->
        <div class="cannon-container" id="cannon-box"></div>
    </div>

    <!-- 奖励 -->
    <div class="daily-r56-rewards">
        <div class="reward-box">
            <span style="font-size:24px">💰</span>
            <text class="txt-yellow">+20</text>
        </div>
        <div class="reward-box">
            <span style="font-size:24px">🐚</span>
            <text class="txt-blue">+1</text>
        </div>
    </div>

    <!-- 双倍按钮 -->
    <div class="daily-r8-btn">
        <button class="btn-ad-boost-xl">
            <span style="margin-right:8px">📺</span> 看视频全额双倍领取
        </button>
    </div>

</div>

<script>
    // 生成飘落彩带
    const cBox = document.getElementById('confetti-box');
    const colors = ['#FF6B6B', '#FFE57F', '#4FC3F7', '#A8D86E', '#CE93D8', '#FF8E53'];
    for(let i=0; i<40; i++) {
        let el = document.createElement('div');
        el.className = 'confetti';
        el.style.left = Math.random() * 95 + '%';
        el.style.background = colors[i % colors.length];
        el.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
        el.style.animationDelay = (Math.random() * 2) + 's';
        if(i%3 === 0) el.style.borderRadius = '50%';
        el.style.width = (6 + Math.random()*8) + 'px';
        el.style.height = el.style.width;
        cBox.appendChild(el);
    }

    // 生成涌泉礼炮 (标准最新版：1s起步随机延迟，无限循环，密集高射炮)
    const cannonBox = document.getElementById('cannon-box');
    
    // 生成左侧12个
    for(let i=0; i<12; i++) {
        let el = document.createElement('div');
        el.className = 'cannon-particle';
        el.style.left = (Math.random() * 10 - 2) + '%';
        el.style.background = colors[i % colors.length];
        // 高速喷射 & 极度打散的角度
        let tx = 60 + Math.random() * 120; // x像素偏移
        let ty = -100 - Math.random() * 200; // y像素偏移
        let rot = 120 + Math.random() * 360; 
        el.style.setProperty('--tx', tx + 'px');
        el.style.setProperty('--ty', ty + 'px');
        el.style.setProperty('--rot', rot + 'deg');
        
        let dur = (1.0 + Math.random() * 0.6).toFixed(1);
        let del = (1.0 + Math.random() * 0.4).toFixed(1); // 1.0s ~ 1.4s
        el.style.animation = `shoot-left ${dur}s cubic-bezier(0.1, 0.8, 0.3, 1) ${del}s infinite`;
        
        if(i%2 === 0) el.style.borderRadius = '50%';
        if(i%4 === 0) { el.style.width = '4px'; el.style.height = '12px'; } // 细长条
        cannonBox.appendChild(el);
    }

    // 生成右侧12个
    for(let i=0; i<12; i++) {
        let el = document.createElement('div');
        el.className = 'cannon-particle';
        el.style.right = (Math.random() * 10 - 2) + '%';
        el.style.background = colors[i % colors.length];
        
        let tx = -60 - Math.random() * 120;
        let ty = -100 - Math.random() * 200;
        let rot = -120 - Math.random() * 360; 
        el.style.setProperty('--tx', tx + 'px');
        el.style.setProperty('--ty', ty + 'px');
        el.style.setProperty('--rot', rot + 'deg');

        let dur = (1.0 + Math.random() * 0.6).toFixed(1);
        let del = (1.0 + Math.random() * 0.4).toFixed(1);
        el.style.animation = `shoot-right ${dur}s cubic-bezier(0.1, 0.8, 0.3, 1) ${del}s infinite`;
        
        if(i%2 === 0) el.style.borderRadius = '50%';
        if(i%4 === 0) { el.style.width = '4px'; el.style.height = '12px'; } // 细长条
        cannonBox.appendChild(el);
    }
</script>
</body>
</html>
