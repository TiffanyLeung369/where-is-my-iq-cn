<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>棋盘入场动画预览</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0;
            background-color: #BBEBFF;
            font-family: -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; overflow: hidden;
            color: #2c5f7c;
        }

        .controls {
            position: absolute; top: 30px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; width: 90%;
        }
        button {
            background: #fff; border: none; padding: 12px 16px; border-radius: 20px;
            font-weight: bold; color: #4a668c; box-shadow: 0 4px 10px rgba(0,0,0,0.1); cursor: pointer;
            transition: transform 0.2s;
        }
        button:active { transform: scale(0.95); }

        /* 棋盘外框 */
        .board-container {
            width: 320px; height: 320px;
            background: rgba(255, 255, 255, 0.4);
            border: 6px solid #fff;
            border-radius: 16px;
            padding: 8px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            perspective: 800px; /* 3D用的视距 */
        }

        /* 棋盘格子 */
        .cell {
            background: #fff;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            display: flex; align-items: center; justify-content: center;
        }
        
        .cell-content { width: 60%; height: 60%; background: #94A3B8; border-radius: 50%; opacity: 0.2; }

        /* ================================= */
        /* 方案 A: 弹性跃出 (整体 Q弹) */
        .anim-a {
            animation: bounceInBoard 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }
        @keyframes bounceInBoard {
            0% { opacity: 0; transform: scale(0.6) translateY(40px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ================================= */
        /* 方案 B: 矩阵涟漪展开 (惊艳逐格) */
        .anim-b {
            /* 容器本身只需淡入 */
            animation: fadeInBoard 0.5s ease both;
        }
        .anim-b .cell {
            animation: rippleCell 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        }
        @keyframes rippleCell {
            0% { opacity: 0; transform: scale(0.2) translateZ(0); }
            100% { opacity: 1; transform: scale(1) translateZ(0); }
        }
        @keyframes fadeInBoard { 
            0% { opacity: 0; transform: scale(0.95); } 
            100% { opacity: 1; transform: scale(1); } 
        }

        /* ================================= */
        /* 方案 C: 3D 翻转质感入场 */
        .anim-c {
            animation: flipIn3D 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both;
            transform-origin: top center;
        }
        @keyframes flipIn3D {
            0% { opacity: 0; transform: perspective(800px) rotateX(-60deg) translateY(-50px) scale(0.9); }
            100% { opacity: 1; transform: perspective(800px) rotateX(0deg) translateY(0) scale(1); }
        }
        
    </style>
</head>
<body>

    <div class="controls">
        <button onclick="playAnim('anim-a')">方案A：整体弹性跃出 (Q弹)</button>
        <button onclick="playAnim('anim-b')">方案B：矩阵涟漪展开 (惊艳)</button>
        <button onclick="playAnim('anim-c')">方案C：3D翻转入场 (高级质感)</button>
    </div>

    <!-- 方案B的涟漪特效默认开启一次 -->
    <div class="board-container anim-b" id="board">
        <!-- 动态生成 25 个格子 -->
    </div>

    <p style="position: absolute; bottom: 40px; font-weight: bold; color: #4a668c; font-size: 14px;">请点击上方按钮预览不同入场动效</p>

    <script>
        const board = document.getElementById('board');
        
        // 动态生成格子，方案B必须用到 animationDelay
        for(let i=0; i<25; i++) {
            let row = Math.floor(i/5);
            let col = i%5;
            // 计算从中心 (2,2) 向外扩散的曼哈顿距离
            let dist = Math.abs(row - 2) + Math.abs(col - 2);
            // 每个距离梯度增加 50ms 的延迟
            let delay = dist * 0.05; 
            
            let cell = document.createElement('div');
            cell.className = 'cell';
            cell.style.animationDelay = delay + 's';
            
            let inner = document.createElement('div');
            inner.className = 'cell-content';
            cell.appendChild(inner);
            board.appendChild(cell);
        }

        // 重新播放动画的黑魔法触发
        function playAnim(animClass) {
            board.className = 'board-container';
            // 访问 offsetWidth 强制浏览器重绘 (reflow)
            void board.offsetWidth;
            board.className = 'board-container ' + animClass;
        }
    </script>
</body>
</html>
